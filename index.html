<style>
  html,body{margin:0;padding:0;background:#fffdfc}
  #alfaFrame{width:100%;border:0;display:block}
</style>
</head>
<body>

<!--
  GANTI URL DI BAWAH dengan URL deployment GAS kamu, contoh:
  https://script.google.com/macros/s/AKfycb.../exec
-->
<iframe
  id="alfaFrame"
  src="https://script.google.com/macros/s/AKfycbzsebwlK2N7wKGrPvzqRMb7kPAeBIcu23l4uJ-maxEba7fzg9g6XHZ1V8_2d9xJQg_B/exec"
  title="Alfa Fitness Medan"
  scrolling="no"
  loading="eager"
  referrerpolicy="strict-origin-when-cross-origin">
</iframe>

<script>
  // Terima pesan tinggi konten dari dalam GAS (dikirim lewat postMessage di script.html GAS)
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'alfaFitnessHeight') {
      var h = parseInt(e.data.height, 10);
      if (h && h > 0) {
        document.getElementById('alfaFrame').style.height = h + 'px';
      }
    }
  });

  // Fallback awal: kasih tinggi minimum sebelum pesan pertama diterima,
  // supaya tidak terlihat kosong/collapse saat baru load.
  document.getElementById('alfaFrame').style.height = '100vh';
</script>

</body>
